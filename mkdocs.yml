site_name: ele blog
site_url: https://eeeleeeeee.github.io/blog/
copyright: Copyright &copy; <span class="copyright-year">2026</span> ele

extra:
  generator: false

extra_javascript:
  - javascripts/copyright-year.js

theme:
  name: material
  font:
    text: Noto Sans TC
    code: JetBrains Mono
  icon:
    logo: material/elephant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換成深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換成淺色模式
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow

plugins:
  - search
  - blog:
      archive: false
      post_url_format: "{slug}"

nav:
  - Home: index.md
  - Blog:
      - blog/index.md
